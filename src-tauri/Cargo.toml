[package]
name = "preview-alternative"
version = "0.1.0"
description = "Fast macOS Preview alternative built with Tauri v2, Rust & Svelte"
edition = "2021"

[lib]
name = "preview_alternative_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
tracy = ["dep:tracy-client", "dep:tracing-tracy"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
pdfium-render = "0.8"
lopdf = "0.34"
image = { version = "0.25", features = ["png", "jpeg", "webp", "bmp"] }

miniz_oxide = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
serde_bytes = "0.11"
libc = "0.2"
ureq = { version = "2.9", features = ["json"] }
lru = "0.18.1"
rusty-tesseract = "1.1"
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-log = "2.9.0"
rhai = { version = "1.25.1", features = ["sync"] }
uuid = { version = "1.24.0", features = ["v4"] }
sha2 = "=0.10.9"

regex = "1.10"

base64 = "0.21"
thiserror = "2.0.19"
parking_lot = "0.12"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
console-subscriber = "0.4"
tracy-client = { version = "0.17", optional = true }
tracing-tracy = { version = "0.11", optional = true }
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tauri = { version = "2.0.0", features = ["test"] }

[profile.release]
debug = "line-tables-only"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
