[package]
name = "preview-alternative"
version = "0.1.0"
description = "Fast macOS Preview alternative built with Tauri v2, Rust & Svelte"
edition = "2021"
rust-version = "1.97"
default-run = "preview-alternative"
[lib]
name = "preview_alternative_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
tracy = ["dep:tracy-client", "dep:tracing-tracy"]
# Explicitly opt-in integration-test authority. This feature is never enabled
# by the production build or Tauri runtime configuration.
secure-redaction-test-support = []
# Compile-only real-process failure/cancellation seams for sanitization
# acceptance tests. Never enabled by the production/Tauri build.
sanitization-test-support = []
# Compile-only real-process adversarial seams for plugin worker supervisor
# acceptance tests. Never enabled by the production or release Tauri build.
plugin-test-support = []
# Builds the fake PDFium worker used by tests/worker_broker_process.rs. Enabled
# only through the self dev-dependency below, so `cargo test` builds the helper
# while `cargo build` and `tauri build` (which bundles every package binary
# whose required features are met) leave it out of the app bundle.
worker-test-support = []

[[bin]]
name = "preview-alternative"
path = "src/main.rs"

[[bin]]
name = "plugin-worker-test-helper"
path = "src/bin/plugin-worker-test-helper.rs"
required-features = ["plugin-test-support"]

[[bin]]
name = "pdfium-worker-test-helper"
path = "src/bin/pdfium-worker-test-helper.rs"
required-features = ["worker-test-support"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
hex = "0.4"
serde_json = "1.0"
sha2 = "0.11"

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
pdfium-render = "0.8"
lopdf = "0.46"
quick-xml = { version = "0.41", features = ["serialize"] }
image = { version = "0.25", features = ["png", "jpeg", "webp", "bmp"] }

miniz_oxide = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
serde_bytes = "0.11"
libc = "0.2"
lru = "0.18.1"
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }
rhai = { version = "1.25.1", features = ["sync"] }
uuid = { version = "1.24.0", features = ["v4"] }
sha2 = "=0.11.1"

regex = "1.10"

base64 = "0.21"
thiserror = "2.0.19"
parking_lot = "0.12"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracy-client = { version = "0.17", optional = true }
tracing-tracy = { version = "0.11", optional = true }
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tauri = { version = "2.0.0", features = ["test"] }
# Self-reference: turns on test-only features for test/bench/example builds.
preview-alternative = { path = ".", features = ["worker-test-support"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# `tauri dev` and `cargo test` build the app unoptimized, but the heavy work on large PDFs
# (hashing, lopdf parsing, decompression) happens in dependencies. Unoptimized, rotating a
# page of a 130 MiB book took 46 s instead of 5 s. Optimizing only dependencies keeps the
# app's own code debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
