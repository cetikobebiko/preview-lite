# cargo-audit configuration (read when `cargo audit` runs in src-tauri/).
# CI: .github/workflows/dependency-audit.yml. Vulnerabilities fail the job;
# unmaintained/unsound warnings are reported but do not.
#
# Every ignored advisory needs a reason, the boundary that contains it and
# the exit condition. Remove the entry as soon as the exit condition is met.
# RUSTSEC-2026-0187 (lopdf 0.34) was removed with the lopdf 0.45 upgrade.

[advisories]
ignore = []
