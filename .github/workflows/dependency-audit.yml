name: Dependency audit

# RustSec advisory check for src-tauri/Cargo.lock. Separate from FAST_LOCAL:
# fetching the advisory database is network access FAST_LOCAL's
# DEPENDENCY_PROVISIONING_ONLY model does not allow (ci-architecture.md §9).
# The weekly run catches advisories published without any code change.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.99.1 (pinned)
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install cargo-audit 0.22.2 (pinned)
        run: cargo install cargo-audit --locked --version 0.22.2

      # Vulnerabilities fail the job; unmaintained/unsound warnings are only
      # reported. Ignored advisories and their exit conditions live in
      # src-tauri/.cargo/audit.toml.
      - name: Audit Cargo.lock
        run: cargo audit
        working-directory: src-tauri
