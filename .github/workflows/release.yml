name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Pin npm used by the lockfile
        run: npm install --global npm@10.9.2

      - name: Verify Node.js toolchain
        run: node --version && npm --version

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        run: npm run test

      - name: Build Frontend
        run: npm run build

      - name: Check Svelte and TypeScript
        run: npx --no-install svelte-check --tsconfig ./jsconfig.json

      - name: Install Rust 1.99.1 (pinned)
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Install Linux Dependencies (Tauri)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verify Rust Formatting
        run: cargo fmt --all -- --check
        working-directory: ./src-tauri

      - name: Provision verified PDFium runtime
        if: runner.os != 'macOS'
        run: node scripts/provision-pdfium-runtime.mjs

      - name: Check Rust Targets
        run: cargo check --locked --all-targets --all-features
        working-directory: ./src-tauri

      - name: Run Rust Tests
        run: cargo test --locked
        working-directory: ./src-tauri

      - name: Enforce strict Rust lint gate
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: ./src-tauri
        
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'PreviewLite v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
