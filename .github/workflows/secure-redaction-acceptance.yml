name: Secure redaction platform certification

# Runtime certification for secure redaction (8B, secure_rasterized_pages_v1)
# on every target that ships a PDFium runtime (docs/engineering/platform-support.json):
# macOS arm64, Linux x86_64 and Windows x86_64. macOS x86_64 has no PDFium
# runtime and is not a supported target, so it is deliberately absent.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-redaction-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Secure redaction execution acceptance (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS arm64
          - os: ubuntu-22.04
            label: Linux x86_64
          - os: windows-latest
            label: Windows x86_64

    env:
      EXPECTED_TESTS: "11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        if: runner.os != 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install Rust 1.99.1 (pinned)
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verify the runner architecture
        shell: bash
        run: |
          arch="$(uname -m)"
          echo "runner architecture: $arch"
          case "$RUNNER_OS" in
            macOS) test "$arch" = "arm64" ;;
            Linux|Windows) test "$arch" = "x86_64" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac

      - name: Verify the bundled arm64 PDFium runtime
        if: runner.os == 'macOS'
        shell: bash
        working-directory: src-tauri
        run: |
          test -f lib/libpdfium.dylib
          file lib/libpdfium.dylib | grep -q arm64

      - name: Provision verified PDFium runtime
        if: runner.os != 'macOS'
        run: node scripts/provision-pdfium-runtime.mjs

      - name: Run secure redaction execution acceptance
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --locked --features secure-redaction-test-support \
            --test secure_redaction_execution_acceptance 2>&1 | tee "$RUNNER_TEMP/acceptance.log"

      - name: Require exactly the expected test count (zero tests is a failure)
        shell: bash
        run: |
          log="$RUNNER_TEMP/acceptance.log"
          running="$(grep -E '^running [0-9]+ tests?$' "$log" | awk '{print $2}')"
          result="$(grep -E '^test result: ' "$log")"
          echo "running: ${running:-<none>}"
          echo "$result"
          if [ "$(printf '%s\n' "$running" | grep -c .)" -ne 1 ]; then
            echo "::error::expected exactly one test binary run, got: ${running:-none}"
            exit 1
          fi
          if [ "$running" != "$EXPECTED_TESTS" ]; then
            echo "::error::expected $EXPECTED_TESTS tests, cargo ran ${running}"
            exit 1
          fi
          if ! printf '%s\n' "$result" | grep -qE "^test result: ok\. ${EXPECTED_TESTS} passed; 0 failed; 0 ignored; 0 measured; 0 filtered out"; then
            echo "::error::acceptance result is not ${EXPECTED_TESTS} passed / 0 failed / 0 ignored"
            exit 1
          fi
          echo "${EXPECTED_TESTS}/${EXPECTED_TESTS} secure redaction acceptance tests passed on $RUNNER_OS $(uname -m)"
